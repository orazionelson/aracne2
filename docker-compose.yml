services:

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aracne2

  existdb:
    image: existdb/existdb:6.4.1
    environment:
      EXIST_PASSWORD: ${EXIST_PASSWORD}
    volumes:
      - existdb_data:/exist/data
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - aracne2

  backend:
    build:
      context: ./backend
    env_file: .env
    volumes:
      - ./backend:/app
      - /app/__pycache__
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      existdb:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aracne2

  frontend:
    build:
      context: ./frontend
      target: development
    env_file: .env
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aracne2

  # ── Postfix MTA (optional — activate with: docker compose --profile email up) ──
  # The backend talks plain SMTP to ``postfix:25`` (no auth, no TLS) on the
  # aracne2 network. Postfix handles the queue, retry and DKIM signing, then
  # relays outward via ``RELAYHOST`` — typically the operator's own SMTP relay
  # (Mailgun, SES SMTP, an internal smarthost, …). Credentials live in env
  # vars consumed only by this container; the Aracne2 backend never sees them.
  #
  # Backend behaviour without this container is benign: when
  # ``system_settings.email_enabled`` is ``false`` (the default), the email
  # service short-circuits before opening any SMTP connection, so the rest
  # of the platform boots and runs even when the email profile is off.
  #
  # In dev you can swap ``boky/postfix`` for ``axllent/mailpit`` to capture
  # outgoing mail in a web UI without setting up a relay; the backend
  # config (``email_smtp_host=postfix``, port 25) stays the same — just
  # rename the service or add an alias.
  postfix:
    image: boky/postfix:latest
    profiles:
      - email
    environment:
      ALLOWED_SENDER_DOMAINS: ${SMTP_ALLOWED_SENDER_DOMAINS:-}
      RELAYHOST: ${SMTP_RELAY_HOST:-}
      RELAYHOST_USERNAME: ${SMTP_RELAY_USER:-}
      RELAYHOST_PASSWORD: ${SMTP_RELAY_PASSWORD:-}
    networks:
      - aracne2

  # ── EVT viewer (optional — activate with: docker compose --profile evt up) ──
  # Sidecar nginx container that serves the EVT 2 SPA. The Python side of
  # the plugin lives in backend/app/plugins/evt/; the build context below
  # points at the matching container/ subdirectory so everything EVT-related
  # is colocated under the plugin.
  evt:
    build:
      context: ./backend/app/plugins/evt/container
    profiles:
      - evt
    ports:
      - "127.0.0.1:8181:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aracne2

  # ── pgvector — RAG vector store (optional, activates with --profile ai-local) ──
  # Separate Postgres instance dedicated to vector embeddings, kept apart from
  # the main platform DB. Backend reaches it at pgvector:5432 on the aracne2
  # network. Host port 5433 exposed for local debugging (psql, dump, …).
  pgvector:
    image: pgvector/pgvector:pg17
    profiles:
      - ai-local
    environment:
      POSTGRES_DB: ${PGVECTOR_DB:-aracne2_vectors}
      POSTGRES_USER: ${PGVECTOR_USER:-aracne2}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:-changeme_pgvector}
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aracne2

  # ── Ollama local AI (optional — activate with: docker compose --profile ai-local up) ──
  # Backend reaches it at http://ollama:11434 on the aracne2 network. Pull a model
  # before first use with:
  #   docker compose exec ollama ollama pull llama3.1:8b
  # For GPU, see docs/OPERATIONS.md.
  ollama:
    image: ollama/ollama:latest
    profiles:
      - ai-local
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - aracne2

networks:
  aracne2:
    driver: bridge

volumes:
  postgres_data:
  existdb_data:
  ollama_data:
  pgvector_data:
