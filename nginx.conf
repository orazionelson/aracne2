server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    # Allow XML uploads up to 50MB
    client_max_body_size 50m;

    # Security headers are repeated in every location block that defines its own
    # add_header directives. This is required because in nginx, any add_header in a
    # child block completely overrides all add_header directives from the parent.

    # API: proxy to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Uncomment when HTTPS is active:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SEO: crawlers expect robots.txt and sitemap*.xml at the site root, but
    # the backend serves them under /api/v1 like the rest of the API surface.
    # Proxy the root-level paths to the backend so the URLs crawlers fetch
    # match the ones they know how to discover.
    location = /robots.txt {
        proxy_pass http://backend:8000/api/v1/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ~ ^/sitemap(-[a-z-]+)?\.xml$ {
        proxy_pass http://backend:8000/api/v1$uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Public website pages: /sites/<slug>/... → /api/v1/sites/<slug>/...
    # The backend still serves the routes under /api/v1 (so existing
    # bookmarks and integrations keep working), but the user-facing
    # URL is the cleaner /sites/<slug>/ path.
    location ~ ^/sites/ {
        proxy_pass http://backend:8000/api/v1$uri$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Hashed assets: aggressive cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback: serve index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'" always;
        # Uncomment when HTTPS is active:
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
