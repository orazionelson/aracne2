server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's embedded DNS — required when proxy_pass contains variables ($slug, $filename)
    # so that nginx resolves the upstream hostname at request time, not at startup.
    resolver 127.0.0.11 valid=30s;

    # EVT config.json — generated dynamically by the Aracne2 backend
    location ~ ^/evt/(?<slug>[^/]+)/config/config\.json$ {
        proxy_pass http://backend:8000/api/v1/public/collections/$slug/evt-config;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # XML data files — proxied from the Aracne2 public API
    location ~ ^/evt/(?<slug>[^/]+)/data/(?<filename>[^/]+\.xml)$ {
        proxy_pass http://backend:8000/api/v1/public/collections/$slug/documents/$filename/raw;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # EVT static assets — strip the collection slug from the path
    location ~ ^/evt/[^/]+/(.+)$ {
        rewrite ^/evt/[^/]+/(.+)$ /$1 break;
        try_files $uri =404;
        expires 7d;
    }

    # EVT index.html — serve for any /evt/{slug}/ request
    location ~ ^/evt/[^/]+/?$ {
        try_files /index.html =404;
    }

    # Health check
    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
