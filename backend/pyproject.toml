[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E","F","W","I","N","UP","ASYNC","S","B","A","C4","PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["S", "ARG"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
